<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>すぐ話せる中国語</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="visually-hidden">すぐ話せる中国語</h1>
    <button id="belt-display" class="belt-display" type="button"></button>
    <p class="subtitle">聞く → まねする → 話す。よく使うフレーズから覚えよう</p>
    <nav class="tabs">
      <button class="tab active" data-view="phrases">フレーズ</button>
      <button class="tab" data-view="quiz">クイズ</button>
      <button class="tab" data-view="tones">声調</button>
      <button class="tab" data-view="talk">会話練習</button>
      <button class="tab" data-view="camera">写真で単語</button>
      <button class="tab" data-view="dojo">昇級審査</button>
    </nav>
  </header>

  <main class="container">
    <div class="settings">
      <label>読み上げスピード
        <input type="range" id="rate" min="0.5" max="1.2" step="0.1" value="0.8">
        <span id="rate-value">0.8</span>
      </label>
      <span id="progress" class="progress"></span>
    </div>
    <p id="support-warning" class="warning" hidden></p>

    <!-- フレーズ -->
    <section id="view-phrases" class="view">
      <div id="categories" class="categories"></div>
      <div id="phrase-list" class="phrase-list"></div>
    </section>

    <!-- クイズ -->
    <section id="view-quiz" class="view" hidden>
      <div class="quiz-card">
        <p class="quiz-label">中国語でなんと言う？</p>
        <p id="quiz-question" class="quiz-question"></p>
        <div id="quiz-options" class="quiz-options"></div>
        <p id="quiz-result" class="quiz-result"></p>
        <div class="quiz-footer">
          <span id="quiz-score"></span>
          <button id="quiz-next" class="btn primary">次の問題</button>
        </div>
      </div>
    </section>

    <!-- 声調 -->
    <section id="view-tones" class="view" hidden>
      <p class="hint">中国語は音の高さ（声調）で意味が変わります。同じ「ma」でも4通り。押して聞き比べてみよう。</p>
      <div id="tone-list" class="tone-list"></div>
    </section>

    <!-- 会話練習 -->
    <section id="view-talk" class="view" hidden>
      <div id="talk-menu">
        <div class="talk-settings">
          <label>説明の言語 / 说明语言
            <select id="talk-lang">
              <option value="ja">日本語</option>
              <option value="zh">中文</option>
            </select>
          </label>
        </div>
        <p class="hint">場面を選ぶと相手が中国語で話しかけてきます。🎤で返事をして、伝わるか試してみよう。</p>
        <div id="talk-list" class="talk-list"></div>
      </div>

      <div id="talk-stage" hidden>
        <div class="talk-header">
          <button id="talk-back" class="btn"></button>
          <span id="talk-title" class="talk-title"></span>
        </div>
        <div id="talk-log" class="chat-log"></div>
        <div id="talk-turn" class="talk-turn">
          <p id="talk-turn-label" class="talk-turn-label"></p>
          <div class="talk-input-row">
            <button id="talk-mic" class="btn primary"></button>
            <input id="talk-input" type="text">
            <button id="talk-send" class="btn"></button>
          </div>
          <div class="phrase-actions">
            <button id="talk-hint-btn" class="btn"></button>
            <button id="talk-skip" class="btn"></button>
          </div>
          <p id="talk-status" class="talk-status"></p>
          <div id="talk-hint" class="talk-hint" hidden></div>
        </div>
      </div>
    </section>

    <!-- 写真で単語（画像認識） -->
    <section id="view-camera" class="view" hidden>
      <p class="hint">花や動物を写すと、中国語で何と言うかがわかります。写真はこの端末の中だけで解析され、どこにも送信されません。</p>
      <div class="camera-actions">
        <label class="btn primary">📷 写真を選ぶ
          <input type="file" id="photo-input" accept="image/*" hidden>
        </label>
        <button id="camera-start" class="btn">🎥 カメラを使う</button>
        <button id="camera-shoot" class="btn primary" hidden>撮影して調べる</button>
      </div>
      <p id="detect-status" class="detect-status"></p>
      <div class="detect-stage">
        <video id="camera-video" playsinline muted hidden></video>
        <canvas id="detect-canvas" hidden></canvas>
      </div>
      <div id="detect-list" class="phrase-list"></div>
    </section>

    <!-- 昇級審査（空手の帯） -->
    <section id="view-dojo" class="view" hidden>
      <div id="dojo-status" class="dojo-status"></div>
      <div id="dojo-exam" class="quiz-card dojo-card"></div>
      <div id="dojo-keiko" class="quiz-card dojo-card"></div>
      <h2 class="dojo-heading">級と段</h2>
      <ol id="dojo-ladder" class="dojo-ladder"></ol>
      <h2 class="dojo-heading">これまでの記録</h2>
      <ul id="dojo-history" class="dojo-history"></ul>
      <div id="dojo-debug" class="quiz-card dojo-card" hidden></div>
    </section>
  </main>

  <!-- 審査・道場破り・稽古の画面 -->
  <div id="dojo-arena" class="dojo-arena" hidden>
    <div class="dojo-arena-card" role="dialog" aria-modal="true" aria-labelledby="dojo-arena-title">
      <div class="dojo-arena-head">
        <p id="dojo-arena-title" class="dojo-arena-title"></p>
        <button id="dojo-quit" class="btn" type="button">棄権する</button>
      </div>
      <div id="dojo-arena-body"></div>
    </div>
  </div>

  <script src="data/phrases.js"></script>
  <script src="data/scenarios.js"></script>
  <script src="data/objects.js"></script>
  <script src="data/ranks.js"></script>
  <script src="app.js"></script>
  <script src="talk.js"></script>
  <script src="camera.js"></script>
  <script src="confetti.js"></script>
  <script src="dojo.js"></script>
</body>
</html>
